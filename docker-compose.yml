services:
  postgres:
    image: postgres:16
    container_name: aee-postgres
    environment:
      POSTGRES_DB: aee
      POSTGRES_USER: aee
      POSTGRES_PASSWORD: aee123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    build:
      context: ./infra/minio
    container_name: aee-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
