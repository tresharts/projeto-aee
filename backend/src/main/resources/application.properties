spring.application.name=aee-backend

# JWT
api.security.token.secret=${JWT_SECRET:super-secret-key}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aee}
spring.datasource.username=${DATABASE_USERNAME:aee}
spring.datasource.password=${DATABASE_PASSWORD:aee123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
